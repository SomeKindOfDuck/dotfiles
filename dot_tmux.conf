# ---- 基本 ----
# prefix: Ctrl-b は Claude Code (background), Ctrl-a は行頭移動と衝突するので Alt-Space に
unbind C-b
set -g prefix M-Space
bind M-Space send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
# Neovim の Esc 遅延対策
set -sg escape-time 10
# Neovim の autoread / claudecode.nvim 用
set -g focus-events on
# True color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
# Shift+Enter などを Claude Code に渡す
set -s extended-keys on

# ---- pane 操作 (prefix 不要, Neovim の <C-hjkl>/<leader>hjkl に対応させて Alt に) ----
# 移動: Alt-h/j/k/l
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# 分割: Alt-H/J/K/L (その方向に新しい pane を作る, Neovim の <leader>hjkl と同じ向き)
bind -n M-H split-window -hb -c "#{pane_current_path}"
bind -n M-J split-window -v  -c "#{pane_current_path}"
bind -n M-K split-window -vb -c "#{pane_current_path}"
bind -n M-L split-window -h  -c "#{pane_current_path}"

# pane を閉じる / 最大化トグル
bind -n M-q kill-pane
bind -n M-z resize-pane -Z

# リサイズ: prefix + H/J/K/L (押しっぱなし可)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---- window (話題ごとのタブ) ----
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-[ previous-window
bind -n M-] next-window
# window 名を変更 (例: encoding, tdms)
bind r command-prompt -I "#W" "rename-window '%%'"

# ---- copy mode (vi 風) ----
setw -g mode-keys vi
bind -n M-v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# 設定再読み込み
bind R source-file ~/.tmux.conf \; display "reloaded"

# ---- 見た目 ----
set -g status-position top
set -g status-style "bg=default,fg=colour245"
setw -g window-status-current-style "fg=colour81,bold"
set -g pane-active-border-style "fg=colour81"
